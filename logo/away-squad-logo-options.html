<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Away Squad logo options</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --sign:#00704A; --sky:#41B6E6; --skylite:#B3DDF2; --star:#E4002B; --ink:#10231A; --bg:#F3F6F4; --line:#DCE3DF; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Inter, system-ui, sans-serif; padding:24px 16px 60px; }
  .wrap { max-width:780px; margin:0 auto; }
  h1 { font:800 2rem/1 "Barlow Condensed", sans-serif; text-transform:uppercase; margin:0 0 6px; }
  h2 { font:800 1.45rem/1 "Barlow Condensed", sans-serif; text-transform:uppercase; margin:0 0 4px; }
  .muted { color:#55615A; margin:0 0 14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:20px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .big { width:130px; height:130px; flex:none; }
  .lockups { flex:1; min-width:270px; display:grid; gap:10px; }
  .lock { border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px; }
  .lock.dark { background:var(--sign); } .lock.light { background:#fff; border:1px solid var(--line); }
  .lock svg { width:52px; height:52px; flex:none; }
  .word { font:800 2.1rem/1 "Barlow Condensed", sans-serif; letter-spacing:.03em; text-transform:uppercase; }
  .dark .word { color:#fff; } .dark .word span { color:var(--skylite); font-weight:700; }
  .light .word { color:var(--sign); } .light .word span { color:var(--sky); font-weight:700; }
  .sizes { display:flex; gap:14px; align-items:flex-end; margin-top:14px; font-size:.78rem; color:#55615A; flex-wrap:wrap; }
  .sizes div { text-align:center; } .sizes svg { display:block; margin:0 auto 4px; }
  .phone { display:flex; gap:10px; background:linear-gradient(160deg,#3d4a44,#1b2420); padding:12px 14px; border-radius:14px; color:#fff; font-size:.72rem; }
  .phone div { width:56px; text-align:center; } .phone svg, .phone i { display:block; width:52px; height:52px; margin:0 auto 4px; border-radius:12px; } .phone i { background:rgba(255,255,255,.18); }
</style>
</head>
<body><div class="wrap">
  <h1>Away Squad: AS logo options</h1>
  <p class="muted">Each mark is built on “AS” in the Chicago greens, with the city flag's sky blue and red star. The letters use the site's sporty condensed font; the final logo would be traced into clean shapes.</p>
  <div id="opts"></div>
</div>
<script>
function star(cx, cy, R, r = R * 0.5) {
  let d = "";
  for (let i = 0; i < 12; i++) {
    const a = (-90 + i * 30) * Math.PI / 180, rad = i % 2 ? r : R;
    d += (i ? "L" : "M") + (cx + rad * Math.cos(a)).toFixed(2) + " " + (cy + rad * Math.sin(a)).toFixed(2);
  }
  return d + "Z";
}
const T = (x, y, size, fill, extra = "") => `<text x="${x}" y="${y}" text-anchor="middle" font-family="Barlow Condensed" font-weight="800" font-size="${size}" fill="${fill}" ${extra}>AS</text>`;

const MARKS = {
  // 1. Varsity: slanted athletic AS with two speed stripes and a Chicago star
  varsity: `<rect width="100" height="100" rx="20" fill="#00704A"/>
    ${T(48, 68, 60, "#fff", 'font-style="italic" letter-spacing="-1"')}
    <path d="M12 76 H84 L81 81 H9 Z" fill="#41B6E6"/><path d="M8 85 H80 L77 90 H5 Z" fill="#B3DDF2"/>
    <path d="${star(84, 22, 8)}" fill="#E4002B"/>`,

  // 2. Pennant: the away-fans flag, AS on a green pennant with a flag-blue stripe
  pennant: `<rect width="100" height="100" rx="20" fill="#B3DDF2"/>
    <rect x="13" y="12" width="5" height="80" rx="2.5" fill="#10231A"/>
    <path d="M18 16 L90 44 L18 72 Z" fill="#00704A"/>
    <path d="M18 66 L74 44 L90 44 L18 72 Z" fill="#41B6E6"/>
    ${T(42, 53, 26, "#fff", 'letter-spacing="1"')}
    <path d="${star(72, 31, 5.5)}" fill="#E4002B"/>`,

  // 3. Jersey: AS across a team jersey (the squad), star on the chest
  jersey: `<rect width="100" height="100" rx="20" fill="#00704A"/>
    <path d="M30 14 L41 10 Q50 19 59 10 L70 14 L88 30 L79 42 L72 37 V90 H28 V37 L21 42 L12 30 Z" fill="#fff"/>
    <path d="M41 10 Q50 19 59 10" fill="none" stroke="#41B6E6" stroke-width="3"/>
    ${T(50, 70, 36, "#00704A")}
    <path d="${star(50, 30, 6)}" fill="#E4002B"/>
    <rect x="28" y="80" width="44" height="4" fill="#41B6E6"/>`,

  // 4. Crest: a sports-club shield with AS and the Chicago star on top
  crest: `<rect width="100" height="100" rx="20" fill="#fff"/>
    <rect x=".75" y=".75" width="98.5" height="98.5" rx="19.5" fill="none" stroke="#DCE3DF" stroke-width="1.5"/>
    <path d="M50 8 L86 19 V47 C86 69 70 83 50 92 C30 83 14 69 14 47 V19 Z" fill="#00704A"/>
    <path d="M50 14 L80 23.5 V47 C80 66 67 78 50 86 C33 78 20 66 20 47 V23.5 Z" fill="none" stroke="#B3DDF2" stroke-width="2"/>
    ${T(50, 70, 38, "#fff")}
    <path d="${star(50, 30, 7)}" fill="#E4002B"/>`
};

const OPTS = [
  ["varsity", "1 · Varsity", "Slanted jersey lettering with two speed stripes in the flag blues, plus the Chicago star. It's fast, sporty, and sits naturally next to GameChanger and TeamSnap."],
  ["pennant", "2 · Away pennant", "The pennant away fans wave from the bleachers, with a flag-blue stripe and a little Chicago star. It's the most “fan”, and it would make great merch."],
  ["jersey", "3 · Squad jersey", "AS across a team jersey, with the star on the chest. It says “squad” at a glance, and parents could wear the shirt version."],
  ["crest", "4 · Club crest", "A sports-club shield with AS and the Chicago star on top. It's the most classic and “official”, and it looks like a real team badge."]
];

const svg = (id, size) => `<svg viewBox="0 0 100 100" width="${size}" height="${size}" style="border-radius:${size * .2}px">${MARKS[id]}</svg>`;
document.getElementById("opts").innerHTML = OPTS.map(([id, name, why]) => `
  <section class="card">
    <h2>${name}</h2><p class="muted">${why}</p>
    <div class="row">
      ${svg(id, 130).replace("<svg", '<svg class="big"')}
      <div class="lockups">
        <div class="lock dark">${svg(id, 52)}<span class="word">Away <span>Squad</span></span></div>
        <div class="lock light">${svg(id, 52)}<span class="word">Away <span>Squad</span></span></div>
      </div>
    </div>
    <div class="sizes">
      <div>${svg(id, 64)}64 px</div><div>${svg(id, 40)}40 px</div><div>${svg(id, 32)}32 px</div><div>${svg(id, 16)}16 px tab</div>
      <div class="phone"><div><i></i>Photos</div><div>${svg(id, 52)}Away Squad</div><div><i></i>Maps</div></div>
    </div>
  </section>`).join("");
</script>
</body>
</html>
