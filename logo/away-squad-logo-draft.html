<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Away Squad logo rebuild</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:24px; background:#F7F8FA; font:15px Inter, sans-serif; color:#2E3A46; }
  .row { display:flex; gap:24px; flex-wrap:wrap; align-items:center; margin-bottom:24px; }
  .box { padding:22px 28px; border-radius:16px; }
  .navy { background:#0B2A4A; } .light { background:#fff; border:1px solid #DDE1E6; }
  img { display:block; }
  /* Wordmark: AWAY [S-pin] QUAD + tagline */
  .wm { display:inline-flex; flex-direction:column; align-items:center; }
  .wm .word { display:flex; align-items:center; font:800 56px/1 Montserrat, sans-serif; letter-spacing:-.01em; color:#0B2A4A; }
  .wm .word img { height:1.25em; margin:0 -.04em; transform:translateY(.06em); }
  .wm .tag { font:600 13px Montserrat, sans-serif; letter-spacing:.32em; text-transform:uppercase; color:#2E3A46; margin-top:10px; }
  .navy .wm .word, .navy .wm .tag { color:#fff; }
</style></head>
<body>
  <h2 style="font-family:Montserrat">Rebuilt from the brand sheet</h2>
  <div class="row">
    <img src="away-squad-icon.svg" width="160" height="160" alt="">
    <img src="away-squad-icon.svg" width="64" height="64" alt="">
    <img src="away-squad-icon.svg" width="32" height="32" alt="">
    <img src="away-squad-icon.svg" width="16" height="16" alt="">
  </div>
  <div class="row"><div class="box light"><div class="wm"><div class="word">AWAY<img src="away-squad-pin.svg" alt="S">QUAD</div><div class="tag">Your game-day guide, anywhere.</div></div></div></div>
  <div class="row"><div class="box navy"><div class="wm"><div class="word">AWAY<img src="away-squad-pin.svg" alt="S">QUAD</div><div class="tag">Your game-day guide, anywhere.</div></div></div></div>
</body></html>
