<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <!-- Spacing fix of Away_Squad_Logo_Vector.svg: same pin, colors and type; "AWAY" and "QUAD"
       moved so there's an even gap on both sides of the pin (QUAD no longer overlaps it).
       Letters are still live Montserrat text: have them converted to outlines before print. -->
  <title id="title">Away Squad logo</title>
  <desc id="desc">Away Squad wordmark in navy with an orange location-pin S and the tagline Your Game-Day Guide, Anywhere.</desc>
  <defs>
    <linearGradient id="pinOrange" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FF7A3C"/>
      <stop offset="1" stop-color="#F9472A"/>
    </linearGradient>
  </defs>
  <g font-family="Montserrat, Arial, Helvetica, sans-serif" font-weight="800" font-size="180" letter-spacing="-7" fill="#082A44">
    <text x="94" y="235">AWAY</text>
    <text x="951" y="235">QUAD</text>
  </g>
  <g transform="translate(701 62)">
    <path d="M112 0 C52 0 14 40 14 94 C14 142 46 176 83 207 L112 233 L141 207 C178 176 210 142 210 94 C210 40 172 0 112 0 Z" fill="url(#pinOrange)"/>
    <path d="M153 58 C140 43 120 36 99 41 C76 47 66 65 72 83 C78 100 100 108 122 116 C146 125 158 137 155 153 C152 172 131 184 109 181 C91 179 77 170 67 158"
          fill="none" stroke="#082A44" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="112" cy="83" r="20" fill="#082A44"/>
    <circle cx="112" cy="83" r="9" fill="#FF7A3C"/>
  </g>
  <path d="M330 290 H1270" stroke="#FF7A3C" stroke-width="5" stroke-linecap="round"/>
  <text x="800" y="354" text-anchor="middle" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="39" font-weight="600" letter-spacing="9" fill="#082A44">YOUR GAME-DAY GUIDE, ANYWHERE.</text>
</svg>
