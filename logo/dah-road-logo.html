<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAH Road logo</title>
<link rel="icon" href="dah-road-icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#F4F6F8; color:#111418; font:15px/1.5 Inter, system-ui, sans-serif; padding:24px 16px 60px; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font:800 2rem/1 "Barlow Condensed", sans-serif; text-transform:uppercase; margin:0 0 6px; }
  p { color:#555C66; }
  .card { background:#fff; border:1px solid #DDE1E6; border-radius:16px; padding:18px; margin-bottom:18px; }
  .row { display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  .lockup { flex:1; min-width:260px; border-radius:14px; padding:16px 18px; display:flex; align-items:center; gap:12px; }
  .dark { background:#0B2545; color:#fff; } .light { background:#fff; border:1px solid #DDE1E6; color:#0B2545; }
  .word { font:800 2.1rem/1 "Barlow Condensed", sans-serif; letter-spacing:.02em; }
  .word .road { font-weight:600; color:#FFC83D; letter-spacing:.01em; }
  .light .word .road { color:#1B8A4B; }
  .sizes { display:flex; gap:14px; align-items:flex-end; font-size:.8rem; color:#555C66; margin-top:14px; }
  .sizes div { text-align:center; } .sizes img { display:block; margin:0 auto 4px; }
</style>
</head>
<body><div class="wrap">
  <h1>DAH Road logo — draft</h1>
  <p>The D is yellow. The A is a road running to the horizon, with the center line where the crossbar would be: you're always on dah road to someone else's field.</p>
  <div class="card">
    <div class="row">
      <img src="dah-road-icon.svg" width="140" height="140" alt="DAH Road icon">
      <div style="flex:1;min-width:260px;display:grid;gap:10px">
        <div class="lockup dark"><img src="dah-road-icon.svg" width="54" height="54" alt=""><span class="word">DAH <span class="road">ROAD</span></span></div>
        <div class="lockup light"><img src="dah-road-icon.svg" width="54" height="54" alt=""><span class="word">DAH <span class="road">ROAD</span></span></div>
      </div>
    </div>
    <div class="sizes">
      <div><img src="dah-road-icon.svg" width="64" height="64" alt="">64 px</div>
      <div><img src="dah-road-icon.svg" width="40" height="40" alt="">40 px</div>
      <div><img src="dah-road-icon.svg" width="32" height="32" alt="">32 px</div>
      <div><img src="dah-road-icon.svg" width="16" height="16" alt="">16 px tab</div>
    </div>
  </div>
</div></body>
</html>
